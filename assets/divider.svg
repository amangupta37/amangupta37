<svg width="1200" height="50" viewBox="0 0 1200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- GitHub marketing gradient: green → blue → purple -->
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7ee787" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#a371f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cometGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="40%" stop-color="#79c0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tail" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="24" width="1200" height="2" fill="url(#line)"/>

  <!-- twinkle accents on the line -->
  <g fill="#e6edf3">
    <circle cx="300" cy="25" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="25" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="25" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- comet sweeping across -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-120,0; 1320,0" dur="6s" repeatCount="indefinite"/>
    <rect x="-90" y="23.5" width="90" height="3" rx="1.5" fill="url(#tail)"/>
    <circle cx="0" cy="25" r="9" fill="url(#cometGlow)"/>
    <circle cx="0" cy="25" r="3" fill="#f0f6fc"/>
  </g>
</svg>
