<svg width="1000" height="660" viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <!-- Track line: transparent → border → transparent (Aceternity mask-image effect) -->
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="0.1" stop-color="#30363d"/>
      <stop offset="0.9" stop-color="#30363d"/>
      <stop offset="1" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
    <!-- Beam: to-transparent via-blue from-purple (Aceternity beam, Primer colors) -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="55%" stop-color="#a371f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══ Track ═══ -->
  <rect x="59" y="70" width="2" height="540" fill="url(#track)"/>

  <!-- ═══ Animated beam (loops like the scroll progress) ═══ -->
  <rect x="58.5" y="70" width="3" rx="1.5" height="0" fill="url(#beam)" filter="url(#soft)">
    <animate attributeName="height" values="0;540;540;0" keyTimes="0;0.72;0.97;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <!-- beam head glow -->
  <circle cx="60" r="5" cy="70" fill="#79c0ff" filter="url(#soft)">
    <animate attributeName="cy" values="70;610;610;70" keyTimes="0;0.72;0.97;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.72;0.8;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- ════════════════ ENTRY 1 · 2025 ════════════════ -->
  <!-- node -->
  <circle cx="60" cy="110" r="13" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <circle cx="60" cy="110" r="16" fill="url(#dotGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.09;0.97;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="110" r="5" fill="#30363d">
    <animate attributeName="fill" values="#30363d;#30363d;#a371f7;#a371f7;#30363d" keyTimes="0;0.05;0.09;0.97;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- big muted year (Aceternity title style) -->
  <text x="96" y="125" font-size="42" font-weight="800" fill="#6e7681">2025</text>
  <!-- content card -->
  <g opacity="1">
    <animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.05;0.11;0.97;1" dur="12s" repeatCount="indefinite"/>
    <rect x="330" y="70" width="640" height="180" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="330" y="70" width="3" height="180" rx="1.5" fill="#a371f7"/>
    <text x="354" y="100" font-size="19" font-weight="700" fill="#e6edf3">Senior Software Engineer · Simpplr</text>
    <text x="354" y="121" font-size="12.5" fill="#8b949e">Nov 2025 — Present · Gurgaon, IN · Leading the frontend team</text>
    <text x="354" y="150" font-size="13" fill="#c9d1d9"><tspan fill="#58a6ff">▸ </tspan>Scalable architecture from scratch — 95% code coverage, dev cycle −35%</text>
    <text x="354" y="173" font-size="13" fill="#c9d1d9"><tspan fill="#58a6ff">▸ </tspan>Custom MCP servers + Claude Opus 4.8 — ~20 eng-hours saved every sprint</text>
    <text x="354" y="196" font-size="13" fill="#c9d1d9"><tspan fill="#58a6ff">▸ </tspan>Generic ag-grid for real-time data — load time −25%, ops cost −10%</text>
    <text x="354" y="219" font-size="13" fill="#c9d1d9"><tspan fill="#58a6ff">▸ </tspan>Multi-role login system — 10,000+ users onboarded nationwide</text>
    <text x="354" y="241" font-size="11.5" fill="#6e7681">React · Next.js · TypeScript · Redux · React Query · AG-Grid · MCP</text>
  </g>

  <!-- ════════════════ ENTRY 2 · 2022 ════════════════ -->
  <circle cx="60" cy="310" r="13" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <circle cx="60" cy="310" r="16" fill="url(#dotGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.31;0.35;0.97;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="310" r="5" fill="#30363d">
    <animate attributeName="fill" values="#30363d;#30363d;#58a6ff;#58a6ff;#30363d" keyTimes="0;0.31;0.35;0.97;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="96" y="325" font-size="42" font-weight="800" fill="#6e7681">2022</text>
  <g opacity="1">
    <animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.31;0.37;0.97;1" dur="12s" repeatCount="indefinite"/>
    <rect x="330" y="270" width="640" height="180" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="330" y="270" width="3" height="180" rx="1.5" fill="#58a6ff"/>
    <text x="354" y="300" font-size="19" font-weight="700" fill="#e6edf3">Senior Software Developer · Antino Labs</text>
    <text x="354" y="321" font-size="12.5" fill="#8b949e">Apr 2022 — Nov 2025 · Gurgaon, IN · Promoted within 5 months</text>
    <text x="354" y="350" font-size="13" fill="#c9d1d9"><tspan fill="#3fb950">▸ </tspan>Seller analytics dashboard, 20+ live stats — purchase conversions +15%</text>
    <text x="354" y="373" font-size="13" fill="#c9d1d9"><tspan fill="#3fb950">▸ </tspan>Formik + Yup onboarding stepper with caching — clicks −30%, engagement +25%</text>
    <text x="354" y="396" font-size="13" fill="#c9d1d9"><tspan fill="#3fb950">▸ </tspan>Next.js SSR landing page with Three.js 3D — traffic &amp; rankings +20%</text>
    <text x="354" y="419" font-size="13" fill="#c9d1d9"><tspan fill="#3fb950">▸ </tspan>XSS protection, CSP &amp; encrypted API layers via Axios interceptors</text>
    <text x="354" y="441" font-size="11.5" fill="#6e7681">React · Next.js · TypeScript · RTK Query · Tailwind · Three.js · Crypto.js</text>
  </g>

  <!-- ════════════════ ENTRY 3 · 2021 ════════════════ -->
  <circle cx="60" cy="510" r="13" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <circle cx="60" cy="510" r="16" fill="url(#dotGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.57;0.61;0.97;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="510" r="5" fill="#30363d">
    <animate attributeName="fill" values="#30363d;#30363d;#3fb950;#3fb950;#30363d" keyTimes="0;0.57;0.61;0.97;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="96" y="525" font-size="42" font-weight="800" fill="#6e7681">2021</text>
  <g opacity="1">
    <animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.57;0.63;0.97;1" dur="12s" repeatCount="indefinite"/>
    <rect x="330" y="470" width="640" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="330" y="470" width="3" height="120" rx="1.5" fill="#3fb950"/>
    <text x="354" y="500" font-size="19" font-weight="700" fill="#e6edf3">Software Developer · Antino Labs</text>
    <text x="354" y="521" font-size="12.5" fill="#8b949e">Dec 2021 — Apr 2022 · Gurgaon, IN · First orbit</text>
    <text x="354" y="550" font-size="13" fill="#c9d1d9"><tspan fill="#a371f7">▸ </tspan>Reusable generic component library — consistency across the product</text>
    <text x="354" y="573" font-size="13" fill="#c9d1d9"><tspan fill="#a371f7">▸ </tspan>KYC with Digilocker SDK integration — streamlined verified onboarding</text>
  </g>

  <!-- start marker -->
  <circle cx="60" cy="620" r="3" fill="#30363d"/>
  <text x="80" y="625" font-size="11.5" fill="#6e7681" font-style="italic">↑ the journey continues…</text>
</svg>
